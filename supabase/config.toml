# Logflare analytics requires the Docker daemon exposed on tcp://localhost:2375,
# which is not available in this Windows local-dev environment. It is optional
# for app/e2e testing, so disable it locally to allow the stack to start.
[analytics]
enabled = false

[storage.buckets.compendium-images]
public = true
file_size_limit = 5242880
allowed_mime_types = ["image/png", "image/jpeg", "image/jpg", "image/webp"]

[storage.buckets.custom-tokens]
public = true
file_size_limit = 5242880
allowed_mime_types = ["image/png", "image/jpeg", "image/jpg", "image/webp", "image/gif"]

[storage.buckets.character-portraits]
public = true
file_size_limit = 5242880
allowed_mime_types = ["image/png", "image/jpeg", "image/jpg", "image/webp", "image/gif"]
