name: Validate awakening hotfix

on:
  workflow_dispatch:

# Emergency changes must be authored on a branch and merged through a reviewed
# pull request. This workflow is deliberately validation-only: it cannot patch,
# commit, or push repository content.
permissions:
  contents: read

jobs:
  normal-ci-gates:
    name: Run normal CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
